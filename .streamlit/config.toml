# Dashboard theme. Light by default: it holds up on a projector in a bright room.
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
