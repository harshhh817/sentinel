[project]
name = "ztbaudit"
version = "0.1.0"
description = "AI-driven zero-trust cloud access control with blockchain-anchored audit trails"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ztb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running (training, benchmarks)",
    "fabric: requires a running Hyperledger Fabric test-network",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
